<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a0f">
<title>Gol em Números — Previsões</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Visual próprio do app ("noite de jogo"): estádio escuro, escudos grandes. Não segue o layout do site. */
:root{--bg:#060a0f;--card:#0e151d;--card2:#141e29;--line:#1f2b38;--txt:#eef3f7;--txt2:#8a9aab;--ok:#22e58a;--no:#ff5a67;--live:#ffb020;--azul:#5aa9e6;--gold:#f0a926;
 --f-display:'Space Grotesk',system-ui,sans-serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:var(--f-body);font-size:15px;font-variant-numeric:tabular-nums}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom));min-height:100vh}
svg.i{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex-shrink:0}
button{font-family:inherit;color:inherit}
/* ── HERO ── */
.hero{position:relative;overflow:hidden;padding:calc(18px + env(safe-area-inset-top)) 18px 22px;border-bottom:1px solid var(--line)}
.hero-img{position:absolute;inset:0;background:center/cover no-repeat;opacity:.55}
.hero-art{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% -10%,rgba(34,229,138,.22),transparent 60%),radial-gradient(60% 50% at 100% 0%,rgba(63,143,196,.18),transparent 70%),linear-gradient(180deg,rgba(6,10,15,.2),var(--bg) 96%)}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%;opacity:.12}
.hero>*{position:relative}
.topo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.marca{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.marca b{color:var(--gold)}
.marca .bola{width:26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ok)}
.imp-top{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(14,21,29,.75);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.data{margin:18px 0 2px;font-size:13px;color:var(--txt2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.data select{background:rgba(14,21,29,.7);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-family:inherit}
.resumo{display:flex;align-items:center;gap:18px;margin-top:10px}
.anel{position:relative;width:108px;height:108px;flex-shrink:0}
.anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.anel .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.anel .c b{font-family:var(--f-mono);font-size:24px;line-height:1}
.anel .c small{font-size:11px;color:var(--txt2);margin-top:3px}
.kpis{flex:1;min-width:0}
.kpi-big{font-family:var(--f-mono);font-weight:700;font-size:34px;line-height:1.05}
.kpi-sub{font-size:12px;color:var(--txt2);margin-top:2px}
.kpi-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(14,21,29,.75);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--txt2)}
.pill b{font-family:var(--f-mono);color:var(--txt)}
.ok{color:var(--ok)}.no{color:var(--no)}.live{color:var(--live)}.mut{color:var(--txt2)}.azul{color:var(--azul)}
/* ── LISTA DE CARTÕES (compactos: 2 por linha no celular, até 3 em tela maior) ── */
main{padding:10px 14px;max-width:980px;margin:0 auto}
.lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.lista{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:700px){.hero{padding-left:max(18px,calc(50vw - 490px));padding-right:max(18px,calc(50vw - 490px))}}
.jogo{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;color:var(--txt)}
.jogo::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--line)}
.jogo.ok::before{background:linear-gradient(90deg,var(--ok),transparent)}
.jogo.no::before{background:linear-gradient(90deg,var(--no),transparent)}
.jogo.live::before{background:linear-gradient(90deg,var(--live),transparent)}
.jogo.ok{background:linear-gradient(180deg,rgba(34,229,138,.07),var(--card) 55%)}
.jogo.no{background:linear-gradient(180deg,rgba(255,90,103,.07),var(--card) 55%)}
.j-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 11px 0;font-size:10px;color:var(--txt2);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.j-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--no);margin-right:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.35}}
.confronto{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:0;padding:8px 3px 4px}
.time{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.time img,.time .fb{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.fb{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-family:var(--f-display);font-weight:700;color:var(--txt2);font-size:13px}
.time span{font-family:var(--f-display);font-weight:600;font-size:10.5px;line-height:1.15;word-break:normal;overflow-wrap:anywhere}
.placar{font-family:var(--f-mono);font-weight:700;font-size:16px;white-space:nowrap;padding:0;letter-spacing:-.06em}
.placar.x{font-size:13px;color:var(--txt2);font-weight:500;letter-spacing:0}
.valor{display:flex;gap:4px;flex-wrap:wrap;padding:2px 7px 7px}
.vtag{font-size:9.5px;border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:3px 6px;color:var(--txt2)}
.vtag b{font-family:var(--f-mono);color:var(--txt)}
.vtag.ok{border-color:rgba(34,229,138,.5)}.vtag.no{border-color:rgba(255,90,103,.45)}
.regras{padding:0 9px 8px;font-size:9.5px;color:var(--txt2);line-height:1.35}
.regras b{color:var(--azul);font-weight:600}
.j-foot{margin-top:auto;padding:8px 9px 10px;display:flex;flex-direction:column;align-items:stretch;gap:7px;border-top:1px solid var(--line)}
.aposta{display:flex;flex-direction:column;gap:2px}
.aposta small{font-size:9px;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em}
.aposta b{font-family:var(--f-display);font-size:12.5px}
.aposta b i{font-style:normal;font-family:var(--f-mono);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:4px;font-size:12px}
.selo{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:999px;padding:6px;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;border:1px solid var(--line);color:var(--txt2);background:var(--card2)}
.selo .v{font-family:var(--f-mono);letter-spacing:0}
.selo.ok{background:var(--ok);border-color:var(--ok);color:#03150c}
.selo.no{background:var(--no);border-color:var(--no);color:#1c0407}
.selo.live{color:var(--live);border-color:var(--live);background:rgba(255,176,32,.1)}
/* regras do dia / conflitos */
.dia-info{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0;flex:1 1 230px}
.barra-hoje{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin:4px 0 12px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{border:1px solid var(--line);background:var(--card);color:var(--txt2);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.fchip b{font-family:var(--f-mono);color:var(--txt);margin-left:5px}
.fsel{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:600;max-width:100%;font-family:inherit}
.fsel.on{border-color:var(--azul);color:var(--azul)}
.rg-sel{width:100%;font-size:11.5px;color:var(--txt2);line-height:1.4;padding:2px 4px 0}
.mes{width:100%;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mes h4{font-family:var(--f-display);font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mes h4 span{font-family:var(--f-mono);font-size:15px}
.mes details summary{cursor:pointer;color:var(--azul);font-size:11.5px;margin-top:6px}
.mes .dl{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;border-top:1px solid var(--line);color:var(--txt2)}
.mes .dl:first-of-type{border-top:0}
.nuvem{margin:6px 20px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:940px}
.nuvem summary{cursor:pointer;padding:12px 14px;font-size:13px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
.nuvem summary::-webkit-details-marker{display:none}
.nuvem .cx{padding:0 14px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--txt2);line-height:1.5}
.nuvem input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;font-size:13px;font-family:var(--f-mono);margin:8px 0}
.nuvem .bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
@media (min-width:1000px){.nuvem{margin-left:auto;margin-right:auto}}
.fchip.on{background:var(--ok);border-color:var(--ok);color:#03150c}.fchip.on b{color:#03150c}
.dia-info>summary{list-style:none;padding:12px 14px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.dia-info>summary::-webkit-details-marker{display:none}
.dia-info .corpo{padding:0 14px 12px;border-top:1px solid var(--line)}
.rg{padding:9px 0;border-top:1px solid var(--line);font-size:12.5px;line-height:1.4}
.rg:first-child{border-top:0}
.rg small{display:block;color:var(--txt2);font-size:11.5px}
.sel{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:1px solid var(--line);margin-right:4px}
.sel.VALIDADA{background:var(--ok);border-color:var(--ok);color:#03150c}
.sel.PROMISSORA{border-color:var(--azul);color:var(--azul)}
.sel.OBS{border-color:var(--live);color:var(--live)}
.sel.NAO{border-color:var(--no);color:var(--no)}
.aviso{border:1px solid var(--live);background:rgba(255,176,32,.08);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;margin:6px 0 12px}
/* ── HISTÓRICO DO DIA ── */
.painel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.painel h3{font-family:var(--f-display);font-size:15px;margin-bottom:4px}
.painel .sub{color:var(--txt2);font-size:12px;margin-bottom:10px;line-height:1.45}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 2px}
.k{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.k b{display:block;font-family:var(--f-mono);font-size:16px}
.k small{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em}
.curva{width:100%;height:auto;display:block}
.lin{display:grid;grid-template-columns:44px 1fr 74px;align-items:center;gap:8px;padding:9px 0;font-size:13px;border-top:1px solid var(--line)}
.lin:first-of-type{border-top:0}
.lin .t{color:var(--txt2);font-size:12px}
.lin .j{min-width:0}.lin .j b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lin .j small{color:var(--txt2);font-size:11px}
.lin .v{font-family:var(--f-mono);font-weight:700;text-align:right;font-size:12.5px}
.vazio{text-align:center;color:var(--txt2);padding:46px 18px;line-height:1.65;border:1px dashed var(--line);border-radius:20px;margin-top:20px}
.vazio svg{font-size:34px;color:var(--ok);margin-bottom:10px;display:block;margin-inline:auto}
.nota{color:var(--txt2);font-size:11.5px;line-height:1.55;margin:20px 20px}
/* barra inferior */
.nav{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:360px;margin:0 auto;display:flex;gap:4px;background:rgba(14,21,29,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:6px;z-index:50}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border:0;border-radius:16px;background:none;color:var(--txt2);font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.02em}
.nav svg{font-size:20px}
.nav .on{color:#03150c;background:var(--ok)}
#toast{position:fixed;left:14px;right:14px;bottom:calc(94px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 15px;display:none;z-index:90;font-size:13px}
</style>
</head>
<body>
<header class="hero">
 <div class="hero-img"></div>
 <div class="hero-art"><svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#fff" stroke-width="1.2"><rect x="20" y="20" width="360" height="180" rx="4"/><path d="M200 20v180"/><circle cx="200" cy="110" r="32"/><rect x="20" y="62" width="52" height="96"/><rect x="328" y="62" width="52" height="96"/></svg></div>
 <div class="topo"><div class="marca"><span class="bola"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/></svg></span>Gol em <b>Números</b></div>
  <label class="imp-top" title="Importar painel_app.json"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg><input id="arq" type="file" accept=".json,application/json" multiple hidden></label></div>
 <div id="heroConteudo"></div>
</header>
<main id="conteudo"></main>
<p class="nota" id="nota"></p>
<div id="nuvemBox"></div>
<input id="arqBkp" type="file" accept=".json,application/json" hidden>
<div id="toast"></div>
<nav class="nav">
 <button id="tHoje" class="on"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoje</button>
 <button id="tHist"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/></svg>Histórico</button>
</nav>
<script>
const CHAVE="previsoes_app_v3",COM=0.05;
let DB={dias:{},info:{},gerado_em:null},aba="hoje",diaSel=null,filtroHoje=null,filtroRegra="";
const IC={ok:'<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
 no:'<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 espera:'<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'};
const URL_ESC=id=>`https://images.fotmob.com/image_resources/logo/teamlogo/${id}.png`;
function carrega(){try{const t=localStorage.getItem(CHAVE);if(t)Object.assign(DB,JSON.parse(t))}catch(e){}if(!DB.dias)DB.dias={};if(!DB.info)DB.info={}}
function salva(){try{localStorage.setItem(CHAVE,JSON.stringify(DB))}catch(e){aviso("Não consegui guardar no aparelho (armazenamento bloqueado). Os dados somem ao fechar.")}}
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const u=v=>(v>=0?"+":"")+v.toFixed(2)+"u",pc=v=>(v>=0?"+":"")+v.toFixed(1)+"%",cl=v=>v>=0?"ok":"no",ganho=o=>(o-1)*(1-COM);
function aviso(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(aviso.t);aviso.t=setTimeout(()=>e.style.display="none",5000)}
function stats(L){const d=L.filter(p=>p.resultado),ok=d.filter(p=>p.resultado=="acertou").length,lucro=d.reduce((t,p)=>t+(p.lucro||0),0);
 return {n:L.length,dec:d.length,ok,erro:d.length-ok,pend:L.length-d.length,taxa:d.length?ok/d.length*100:0,lucro,roi:d.length?lucro/d.length*100:0}}
/* ── Importação ── */
/* A lista do dia (jogos + conflitos já resolvidos pelo painel) vale a partir da PRIMEIRA importação daquele dia. Importações seguintes do mesmo dia
   só atualizam resultado/placar/status e o profit do mês das regras; jogos novos ou removidos no arquivo são ignorados. "Recomeçar este dia" libera de novo. */
function importa(docs){let novas=0,atual=0,ignoradas=0,criados=0;docs.sort((a,b)=>String(a.gerado_em||"").localeCompare(String(b.gerado_em||"")));
 for(const doc of docs){if(!doc||!Array.isArray(doc.previsoes))throw new Error("arquivo não parece um painel_app.json");
  const dia0=doc.dia||(doc.previsoes[0]&&doc.previsoes[0].dia);if(!dia0)throw new Error("arquivo sem o dia");
  const travado=DB.dias[dia0]&&Object.keys(DB.dias[dia0]).length>0;
  if(!travado){const d=DB.dias[dia0]={};for(const p of doc.previsoes){if(!p.id)continue;d[p.id]=p;novas++}
   DB.info[dia0]={sem_regra:!!doc.sem_regra,regras:doc.regras_dia||[],conflitos:doc.conflitos||[],criterio:doc.criterio||null,gerado_em:doc.gerado_em||null};criados++}
  else{const d=DB.dias[dia0];
   for(const p of doc.previsoes){const ant=d[p.id];if(!ant){ignoradas++;continue}
    if(p.resultado||!ant.resultado){d[p.id]={...ant,status:p.status,placar:p.placar,resultado:p.resultado,lucro:p.lucro};if(p.resultado&&!ant.resultado)atual++}}
   const inf=DB.info[dia0]=DB.info[dia0]||{sem_regra:!!doc.sem_regra,regras:[],conflitos:[],criterio:null};
   for(const r of doc.regras_dia||[]){const x=(inf.regras||[]).find(y=>y.id==r.id);if(x&&r.mes)x.mes=r.mes}
   inf.gerado_em=doc.gerado_em||inf.gerado_em}
  DB.gerado_em=doc.gerado_em||DB.gerado_em}
 salva();return {novas,atual,ignoradas,criados}}
/* ── Cópia de segurança: guarda TUDO do app (todos os dias, listas, regras, profit do mês) num arquivo; restaura em qualquer aparelho/navegador ── */
function montaBackup(){return {tipo:"backup_app",versao:3,salvo_em:new Date().toISOString(),DB}}
function salvaCopia(){const b=montaBackup(),dias=Object.keys(DB.dias).length;if(!dias){aviso("Não há nada para salvar ainda.");return}
 const a=document.createElement("a"),h=hojeIso();a.href=URL.createObjectURL(new Blob([JSON.stringify(b)],{type:"application/json"}));a.download="backup_gol_em_numeros_"+h+".json";document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);aviso(`Cópia salva: ${dias} dia(s). Guarde o arquivo (Drive, e-mail ou Telegram) para restaurar quando precisar.`)}
function restauraCopia(b,semPerguntar){if(!b||b.tipo!="backup_app"||!b.DB||!b.DB.dias)throw new Error("esse arquivo não é uma cópia do app");
